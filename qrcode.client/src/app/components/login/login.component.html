<div style="max-width: 400px; margin: 100px auto; padding: 30px; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); font-family: sans-serif;">
  <h2 style="text-align: center; color: #333;">Giriş Yap</h2>

  <div style="margin-bottom: 20px;">
    <label style="display: block; margin-bottom: 5px; font-weight: bold;">E-posta:</label>
    <input type="email" [(ngModel)]="credentials.email" placeholder="ornek@test.com" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
  </div>

  <div style="margin-bottom: 20px;">
    <label style="display: block; margin-bottom: 5px; font-weight: bold;">Şifre:</label>
    <input type="password" [(ngModel)]="credentials.password" placeholder="******" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
  </div>

  <button (click)="login()" style="width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold;">
    Sisteme Gir
  </button>

  <p *ngIf="errorMessage" style="color: #d9534f; margin-top: 15px; text-align: center; font-weight: bold;">
    {{ errorMessage }}
  </p>
</div>
